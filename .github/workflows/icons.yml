name: Refresh Share100 app icons
on:
  push:
    branches: [main]
    paths:
      - icon-source.svg
      - .github/workflows/icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render app icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url="icon-source.svg", write_to=f"icon-{size}.png", output_width=size, output_height=size)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Render updated Share100 percentage app icons"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
